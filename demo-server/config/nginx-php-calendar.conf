# PHP-Calendar 2.0 (latest release)
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    listen 127.0.0.1:8082;
    server_name demo.php-calendar.org;
    root /srv/phpc/release;
    index index.php;

    location ~ /\. { deny all; }
    location ~ ^/(src|locale|config\.php|composer\.(json|lock)|vendor)(/|$) { deny all; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
}

# PHP-Calendar development version (main branch)
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    listen 127.0.0.1:8081;
    server_name dev.php-calendar.org;
    root /srv/phpc/dev/public;

    location / { try_files $uri /index.php$is_args$args; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        internal;
    }
    location ~ \.php$ { return 404; }
}

# Anything else (bare IP, unknown hosts)
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
    return 444;
}
