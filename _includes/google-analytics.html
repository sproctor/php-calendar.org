{%- comment -%}
  Google Analytics 4. Replaces minima 2.5's Universal Analytics snippet, which Google no longer
  collects data for. Like minima's, it skips visitors who have Do Not Track turned on.
{%- endcomment -%}
<script>
if (!(window.doNotTrack === "1" || navigator.doNotTrack === "1" || navigator.doNotTrack === "yes" || navigator.msDoNotTrack === "1")) {
  var script = document.createElement('script');
  script.async = true;
  script.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}';
  document.head.appendChild(script);

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
}
</script>
