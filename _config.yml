title: PHP-Calendar
# Shown after the title in the home page's browser tab and search results
tagline: Open source web calendar
description: >-
  An open source web calendar for groups and individuals, with an emphasis on sharing events and
  collaboration.
baseurl: ""
url: "https://php-calendar.org"

github_username:  sproctor
# Cloudflare Web Analytics site token (public; it appears in every page)
cloudflare_analytics: 0b6df3007e964117848d3cbc95346221

show_excerpts: true
# How many of the newest posts the home page lists; the rest are on /posts/
home_posts: 5
header_pages:
  - posts.html

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Server scripts for the demos, not part of the site
exclude:
  - demo-server/
  - Gemfile
  - Gemfile.lock
