title: PHP-Calendar
# Shown after the title in the home page's browser tab and search results
tagline: Open source web calendar
description: >- # this means to ignore newlines until "baseurl:"
  PHP-Calendar is an open source web calendar. It is intended to provide a simple solution with an
  intuitive interface. It is targeted to groups and individuals with the need to track events with an
  emphasis on group collaboration. In that same collaborative spirit, the source for PHP-Calendar is
  available under the open source Apache 2.0 license to facilitate collaborative development.
baseurl: ""
url: "https://php-calendar.org"

github_username:  sproctor
# Cloudflare Web Analytics site token (public; it appears in every page)
cloudflare_analytics: 0b6df3007e964117848d3cbc95346221

show_excerpts: true
# How many of the newest posts the home page lists; the rest are on /posts/
home_posts: 5
header_pages:
  # don't show any

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Server scripts for the demos, not part of the site
exclude:
  - demo-server/
  - Gemfile
  - Gemfile.lock
